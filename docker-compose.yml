version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: blog-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password123
      POSTGRES_DB: BlogDb
    ports:
      - "5433:5432"
    volumes:
      - blog-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  blog-db-data:
